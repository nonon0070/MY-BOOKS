<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>本棚</title>
  <link rel="stylesheet" href="style.css">
</head> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<section id="shelfPage">

  <h1>本棚</h1>

  <button id="goScanButton">
    ＋ 本を追加
  </button>

  <br><br>

  <input id="titleInput" placeholder="ISBNを入力">

<button id="addButton">
  ISBNで追加
</button>

<br><br>

  <div id="bookList"></div>

</section>

<section id="scanPage" style="display: none;">

  <h1>バーコード読み取り</h1>

  <button id="backButton">
    ← 本棚に戻る
  </button>

  <br><br>

  <video id="video" width="300"></video>

  <br><br>

  <button id="scanButton">
    読み取り開始
  </button>

</section>
  

  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="script.js"></script>

</body>
</html>
