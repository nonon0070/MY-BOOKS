<!DOCTYPE html>
<html lang="ja">
<head>

    <video id="video" width="300"></video>

    <br><br>

    <button id="scanButton">
      バーコード読み取り
    </button>

  </section>

  <section id="shelfPage" style="display: none;">

    <h1>本棚</h1>

    <div id="bookList"></div>

  </section>

  <section id="statsPage" style="display: none;">

    <h1>月間読書本</h1>

    <p>ここは後で作る</p>

  </section>

  <section id="settingsPage" style="display: none;">

    <section id="detailPage" style="display: none;">

  <button id="backToShelfButton">← 本棚に戻る</button>

  <div id="bookDetailBox">
    <img id="detailImage">

    <div id="detailInfo">
      <p id="detailAuthor"></p>
      <p id="detailPublisher"></p>
      <p id="detailPrice"></p>
      <p id="detailPages"></p>
    </div>
  </div>

  <p id="detailRegisteredAt"></p>

  <button id="detailDeleteButton">この本を削除</button>

</section>

    <h1>設定</h1>

  </section>

    <div id="detailInfo">
      <p id="detailAuthor"></p>

    </div>
  </div>

  <p id="detailRegisteredAt"></p>

  <button id="detailDeleteButton">この本を削除</button>

  <nav id="bottomNav">

    <button id="navShelfButton">📚</button>
    <button id="navStatsButton">📊</button>
    <button id="navSettingButton">⚙️</button>
  </nav>

  <script src="https://unpkg.com/@zxing/library@latest"></script>
